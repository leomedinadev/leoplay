server.port=8090

langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.chat-model.log-request=true
langchain4j.open-ai.chat-model.log-response=true
logging.level.dev.langchain4j=DEBUG
logging.level.dev.ai4j.openai4j=DEBUG


# Spring Data JPA
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leoplay_db}
spring.datasource.username=${DB_USERNAME:admin_leoplay_db}
spring.datasource.password=${DB_PASSWORD:admin_leoplay_db}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true